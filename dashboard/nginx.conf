limit_req_zone $binary_remote_addr zone=vw_login:1m rate=5r/m;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 2.31.25.249;
    return 301 https://2.31.25.249$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 2.31.25.249;
    ssl_certificate /home/clp/services/nginx/ssl-certificates/cert.crt;
    ssl_certificate_key /home/clp/services/nginx/ssl-certificates/private.key;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 330s;
    }
    location = /login {
        limit_req zone=vw_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
