name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: python -m pip install -r dashboard/requirements.txt
      - name: Dashboard, API adapter and version checks
        run: python -m unittest discover -s dashboard -p 'test_*.py' -v
      - name: WordPress backups and billing plan
        run: python -m unittest discover -s operations -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q dashboard operations
