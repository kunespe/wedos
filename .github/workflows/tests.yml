name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Broker, Fakturor adapter and version checks
        run: python -m unittest discover -s dashboard -p 'test_*.py' -v
      - name: WordPress backups and billing plan
        run: python -m unittest discover -s operations -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q dashboard operations

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: servero_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/servero_test
      # svelte-check and build validate src/env.ts; these are placeholders, nothing connects to them.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/servero_test
      ORIGIN: http://localhost:3000
      PUBLIC_WEB_ORIGIN: http://localhost:4410
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/panel/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types and Svelte checks
        run: pnpm check
      - name: Unit and database tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: End-to-end tests (order to customer, access, requests, payments)
        # Job-level env wins over .env.e2e (node --env-file never overrides), so restate the e2e values.
        env:
          E2E_DATABASE_URL: mysql://root:root@127.0.0.1:3306/servero_e2e
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/servero_e2e
          ORIGIN: http://127.0.0.1:4173
          PUBLIC_WEB_ORIGIN: http://127.0.0.1:4410
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE IF NOT EXISTS servero_e2e'
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/panel/test-results/

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Landing uses the same price list as the panel
        run: cmp catalog/plans.json apps/web/plans.json
