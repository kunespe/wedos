; Grafana OSS for SERVERO, installed as /etc/grafana/grafana.ini.
; Everything not set here falls back to /usr/share/grafana/conf/defaults.ini.
; Secrets come from /etc/servero-monitoring/grafana.env (EnvironmentFile in
; the grafana-server drop-in) as GF_* variables, which override this file:
;   GF_SECURITY_ADMIN_PASSWORD, GF_SECURITY_SECRET_KEY, GF_SMTP_PASSWORD,
;   GRAFANA_MYSQL_RO_PASSWORD (used by provisioning/datasources).

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3001
domain = monitor.servero.cz
root_url = https://monitor.servero.cz/
enforce_domain = false

[database]
type = sqlite3
path = grafana.db

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
admin_user = admin
disable_initial_admin_creation = false
cookie_secure = true
cookie_samesite = strict
disable_gravatar = true
strict_transport_security = true
content_security_policy = true
allow_embedding = false

[users]
allow_sign_up = false
allow_org_create = false
default_theme = system

[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[auth.anonymous]
enabled = false

[auth.basic]
enabled = false

[snapshots]
external_enabled = false

[smtp]
; PLACEHOLDERS: real relay host and account. Hetzner blocks outbound :25 on
; new projects, so use submission (587) with STARTTLS.
enabled = true
host = smtp.example.invalid:587
user = monitoring@servero.cz
from_address = monitoring@servero.cz
from_name = SERVERO monitoring
startTLS_policy = MandatoryStartTLS

[unified_alerting]
; Alerts are evaluated by Prometheus and routed by Alertmanager. Grafana
; alerting stays available for ad hoc rules and uses the SMTP above.
enabled = true

[log]
mode = console
level = warn

[paths]
provisioning = /etc/grafana/provisioning

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/servero/node.json

[plugins]
enable_alpha = false
# Do not download bundled plugins (mssql, etc.) on start; we only use Prometheus, Loki, Alertmanager, MySQL.
preinstall_disabled = true
