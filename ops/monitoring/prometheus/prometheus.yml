# Prometheus for SERVEROS (127.0.0.1:9090).
# Prometheus does not scrape anything itself except its own /metrics: Grafana
# Alloy is the only agent and pushes everything via remote_write
# (--web.enable-remote-write-receiver). Retention is set by flags in
# prometheus.service (15d / 3GB).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    host: vytvorit-web

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
