# Alertmanager for SERVERO (127.0.0.1:9093).
# PLACEHOLDERS: replace the SMTP values and the Telegram chat_id. Secrets live
# in files readable only by the alertmanager user (created by
# install-monitoring.sh with empty content):
#   /etc/alertmanager/secrets/smtp_password
#   /etc/alertmanager/secrets/telegram_bot_token
# Outbound port 25 is blocked on new Hetzner Cloud projects, so use a relay
# with submission port 587 (for example the mailbox provider of servero.cz).
global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.invalid:587"
  smtp_from: "monitoring@servero.cz"
  smtp_auth_username: "monitoring@servero.cz"
  smtp_auth_password_file: /etc/alertmanager/secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: ["alertname", "domain", "name", "site"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: email-and-telegram
      repeat_interval: 1h

inhibit_rules:
  # Do not spam SSL warnings for a site that is down anyway.
  - source_matchers:
      - alertname="SiteDown"
    target_matchers:
      - alertname="SSLExpiringSoon"
    equal: ["domain"]
  - source_matchers:
      - alertname="SystemdUnitFailed"
    target_matchers:
      - alertname="SystemdUnitNotActive"
    equal: ["name"]

receivers:
  - name: email
    email_configs:
      - to: "admin@servero.cz"
        send_resolved: true

  - name: email-and-telegram
    email_configs:
      - to: "admin@servero.cz"
        send_resolved: true
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        # PLACEHOLDER: numeric chat id (group ids are negative).
        chat_id: -1000000000000
        parse_mode: HTML
        send_resolved: true
