# Security headers for panel.serveros.cz (/etc/nginx/servero/panel-headers.conf).
# The panel app sets X-Content-Type-Options, Referrer-Policy, Permissions-Policy and
# X-Frame-Options itself (src/hooks.server.ts) but only on SvelteKit responses, not on
# static files. The vhost hides the app's copies (proxy_hide_header) and sends these
# instead, with the app's stricter values, so every response carries each header once.
# nginx drops inherited add_header directives in any block that sets its own, so every
# location with add_header includes this file again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The panel (login, client area, admin, public /stav) stays out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
