# Shared reverse proxy settings for SERVEROS app vhosts (/etc/nginx/servero/proxy.conf).
# $servero_connection_upgrade is defined in 00-servero-common.conf (http context).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $servero_connection_upgrade;
proxy_buffering on;
proxy_redirect off;
# Timeouts stay at the nginx default (60s); set proxy_read_timeout per location when needed.
