# Shared security headers for SERVEROS vhosts (/etc/nginx/servero/security-headers.conf).
# nginx drops inherited add_header directives in any block that sets its own,
# so every location with add_header includes this file again.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
