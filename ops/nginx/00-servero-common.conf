# http-context definitions shared by the SERVEROS vhosts. Installed as
# /etc/nginx/sites-enabled/00-servero-common.conf so it loads before them
# (nginx.conf includes sites-enabled/*.conf inside http {}).

# panel.serveros.cz
limit_req_zone $binary_remote_addr zone=servero_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=servero_orders:1m rate=10r/m;
# public domain search on serveros.cz (RDAP lookups); the app limits 30/min per IP as well
limit_req_zone $binary_remote_addr zone=servero_domain:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=servero_panel:5m rate=20r/s;

# monitor.serveros.cz
limit_req_zone $binary_remote_addr zone=servero_grafana_login:1m rate=5r/m;

# Websocket-safe proxying: "upgrade" only when the client asks for it.
map $http_upgrade $servero_connection_upgrade {
    default upgrade;
    ''      '';
}

# Old servero.cz hosts and their serveros.cz counterparts (servero.cz.conf redirects).
map $host $serveros_host {
    default            serveros.cz;
    panel.servero.cz   panel.serveros.cz;
    monitor.servero.cz monitor.serveros.cz;
}
