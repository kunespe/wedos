# The old SERVERO domain after the rebrand: every host 301s to its serveros.cz counterpart,
# path and query kept, so bookmarks and already sent invite links (panel.servero.cz/pozvanka/...)
# keep working. deploy.sh installs this only once serveros.cz has a real certificate
# (DNS moved), replacing the old servero.cz content vhost.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name servero.cz www.servero.cz panel.servero.cz monitor.servero.cz;

    ssl_certificate     /etc/nginx/ssl-certificates/servero.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/servero.cz.key;

    access_log /var/log/nginx/servero-legacy.access.log main;

    # Client webmail stays on the Váš-hosting mail server (mcg07).
    location = /mail {
        return 302 https://mcg07.vas-server.cz/mail/;
    }
    location ^~ /mail/ {
        return 302 https://mcg07.vas-server.cz$request_uri;
    }

    location / {
        return 301 https://$serveros_host$request_uri;
    }
}
