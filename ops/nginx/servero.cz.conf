# servero.cz: static marketing site from apps/web.
# Root /home/servero/htdocs/servero.cz (deployed by ops/deploy.sh).
# Port 80 (ACME + redirect) lives in servero-acme.conf.
# Certificate must cover servero.cz and www.servero.cz.

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.servero.cz;

    ssl_certificate /etc/nginx/ssl-certificates/servero.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/servero.cz.key;

    include /etc/nginx/servero/security-headers.conf;
    return 301 https://servero.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name servero.cz;

    ssl_certificate /etc/nginx/ssl-certificates/servero.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/servero.cz.key;

    root /home/servero/htdocs/servero.cz;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/servero.cz.access.log main;
    error_log /var/log/nginx/servero.cz.error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    include /etc/nginx/servero/security-headers.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    # Client webmail stays on the Váš-hosting mail server (mcg07). 302 so the target can change later.
    location = /mail {
        return 302 https://mcg07.vas-server.cz/mail/;
    }
    location ^~ /mail/ {
        return 302 https://mcg07.vas-server.cz$request_uri;
    }

    # Hidden files and VCS metadata.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # HTML and JSON: always revalidate so content updates show immediately.
    # HTML pages carry the CSP. Third parties used by apps/web: Google Fonts,
    # ARES (IC lookup in objednat.js) and the panel (order API, domain check,
    # /stav.json). No page has an inline script any more (shared code is in
    # site.js; the JSON-LD block on index.html is data, not executed), so
    # script-src is 'self' only.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https://panel.servero.cz https://ares.gov.cz; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:" always;
        include /etc/nginx/servero/security-headers.conf;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/servero/security-headers.conf;
    }

    # CSS/JS use ?v=N cache busting in index.html, images rarely change.
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/servero/security-headers.conf;
        access_log off;
    }

    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/servero/security-headers.conf;
        access_log off;
    }
}
