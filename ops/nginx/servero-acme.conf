# Port 80 for all SERVERO hostnames: ACME http-01 challenges and a 301 to HTTPS.
# Kept separate from the TLS vhosts so it can be enabled before any
# certificate exists (first issuance). Challenges are looked up in
# /var/www/acme (certbot --webroot) and then in the servero.cz site root
# (where a CloudPanel Let's Encrypt run puts them).
server {
    listen 80;
    listen [::]:80;
    server_name servero.cz www.servero.cz panel.servero.cz monitor.servero.cz;

    access_log /var/log/nginx/servero-acme.access.log main;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri @servero_site_acme;
    }

    location @servero_site_acme {
        root /home/servero/htdocs/servero.cz;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
