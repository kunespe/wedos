# serveros.cz: static marketing site from apps/web.
# Root /home/servero/htdocs/serveros.cz (deployed by ops/deploy.sh).
# Port 80 (ACME + redirect) lives in servero-acme.conf.
# Certificate must cover serveros.cz and www.serveros.cz.

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.serveros.cz;

    ssl_certificate /etc/nginx/ssl-certificates/serveros.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/serveros.cz.key;

    include /etc/nginx/servero/security-headers.conf;
    return 301 https://serveros.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name serveros.cz;

    ssl_certificate /etc/nginx/ssl-certificates/serveros.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/serveros.cz.key;

    root /home/servero/htdocs/serveros.cz;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/serveros.cz.access.log main;
    error_log /var/log/nginx/serveros.cz.error.log;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    include /etc/nginx/servero/security-headers.conf;

    # CSP for the HTML pages (location / and the 404 page). Third parties used by apps/web:
    # ARES (IC lookup in objednat.js) and the panel (order API, domain check with RDAP behind
    # it, /stav.json). Fonts are self-hosted (assets/fonts). No page has an inline script
    # (the JSON-LD block on index.html is data, not executed), so script-src is 'self' only;
    # 'unsafe-inline' styles stay for the style="--u:2" custom properties.
    set $serveros_csp "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self' https://panel.serveros.cz https://ares.gov.cz; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'";

    # Unknown paths get the branded page with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $serveros_csp always;
        include /etc/nginx/servero/security-headers.conf;
    }
    # try_files would otherwise serve /404 as 404.html with status 200
    location = /404 {
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    # Client webmail stays on the Váš-hosting mail server (mcg07). 302 so the target can change later.
    location = /mail {
        return 302 https://mcg07.vas-server.cz/mail/;
    }
    location ^~ /mail/ {
        return 302 https://mcg07.vas-server.cz$request_uri;
    }

    # Hidden files and VCS metadata.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # HTML and JSON: always revalidate so content updates show immediately.
    # HTML pages carry the CSP ($serveros_csp above).
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $serveros_csp always;
        include /etc/nginx/servero/security-headers.conf;
    }

    location ~* \.json$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/servero/security-headers.conf;
    }

    # CSS/JS: every page links them with ?v=N, so a versioned URL never changes and is
    # cached for a year as immutable; a bare URL gets a week ($serveros_static_cache,
    # 00-servero-common.conf).
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control $serveros_static_cache always;
        include /etc/nginx/servero/security-headers.conf;
        access_log off;
    }

    # Self-hosted fonts carry their upstream version in the file name (archivo-v25-latin.woff2).
    location ^~ /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/servero/security-headers.conf;
        access_log off;
    }

    # Images: responsive variants (name-width.avif/.webp) are replaced rarely, a month is enough.
    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/servero/security-headers.conf;
        access_log off;
    }
}
