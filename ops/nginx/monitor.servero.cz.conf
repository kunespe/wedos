# monitor.servero.cz: Grafana OSS on 127.0.0.1:3001 (admins only, no anonymous access).
# Port 80 (ACME + redirect) lives in servero-acme.conf.
# Rate limit zones and the websocket map are in 00-servero-common.conf.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monitor.servero.cz;

    ssl_certificate /etc/nginx/ssl-certificates/monitor.servero.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/monitor.servero.cz.key;

    access_log /var/log/nginx/monitor.servero.cz.access.log main;
    error_log /var/log/nginx/monitor.servero.cz.error.log;

    client_max_body_size 2m;
    limit_req_status 429;

    # Optional extra layer, see ops/README.md (hardening): allow only admin IPs.
    # allow 203.0.113.10;
    # deny all;

    # Grafana sends its own CSP and X-Frame-Options (grafana.ini [security]).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /login {
        limit_req zone=servero_grafana_login burst=5 nodelay;
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://127.0.0.1:3001;
    }

    location /api/live/ {
        include /etc/nginx/servero/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://127.0.0.1:3001;
    }
}
