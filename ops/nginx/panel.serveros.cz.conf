# panel.serveros.cz: customer panel (SvelteKit adapter-node) on 127.0.0.1:3000.
# Port 80 (ACME + redirect) lives in servero-acme.conf.

# Rate limit zones and the websocket map are in 00-servero-common.conf.

upstream serveros_panel {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.serveros.cz;

    ssl_certificate /etc/nginx/ssl-certificates/panel.serveros.cz.crt;
    ssl_certificate_key /etc/nginx/ssl-certificates/panel.serveros.cz.key;

    access_log /var/log/nginx/panel.serveros.cz.access.log main;
    error_log /var/log/nginx/panel.serveros.cz.error.log;

    # Forms and JSON only; raise per location if uploads are ever added.
    client_max_body_size 256k;
    limit_req_status 429;

    # Headers: one copy each, from nginx (see servero/panel-headers.conf).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
    include /etc/nginx/servero/panel-headers.conf;

    # Prometheus metrics are for Alloy on localhost only, never public.
    location ^~ /internal/ {
        return 404;
    }

    location = /login {
        limit_req zone=servero_login burst=10 nodelay;
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://serveros_panel;
    }

    location ^~ /api/orders {
        limit_req zone=servero_orders burst=5 nodelay;
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://serveros_panel;
    }

    location ^~ /api/domain-check {
        limit_req zone=servero_domain burst=10 nodelay;
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://serveros_panel;
    }

    # SvelteKit immutable build assets.
    location ^~ /_app/immutable/ {
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://serveros_panel;
        # the app sends the same policy; keep a single Cache-Control header. proxy_hide_header
        # set here replaces the server-level list, so the four hidden above are repeated.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Permissions-Policy;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/servero/panel-headers.conf;
        access_log off;
    }

    location / {
        limit_req zone=servero_panel burst=40 nodelay;
        include /etc/nginx/servero/proxy.conf;
        proxy_pass http://serveros_panel;
    }
}
