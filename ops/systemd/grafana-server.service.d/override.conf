# Drop-in for grafana-server.service from apt.grafana.com
# (/etc/systemd/system/grafana-server.service.d/override.conf).
[Service]
# GF_SECURITY_ADMIN_PASSWORD, GF_SECURITY_SECRET_KEY, GF_SMTP_PASSWORD, GRAFANA_MYSQL_RO_PASSWORD
