# Drop-in for alloy.service from apt.grafana.com
# (/etc/systemd/system/alloy.service.d/override.conf).
[Service]
# adm: /var/log/nginx, systemd-journal: journald. install-monitoring.sh also
# adds the alloy user to each CloudPanel site group so /home/<site>/logs is readable.
SupplementaryGroups=adm systemd-journal
Environment=GOMEMLIMIT=120MiB
MemoryMax=150M
Restart=on-failure
RestartSec=5
